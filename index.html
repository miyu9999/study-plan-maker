<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>逆算学習計画メーカー（仮）</title>
<style>
  :root {
    --primary: #3452c4;
    --primary-dark: #24399a;
    --primary-light: #eef1fd;
    --bg: #f5f6fb;
    --surface: #ffffff;
    --text: #1c2033;
    --text-sub: #6b7086;
    --border: #e2e4f0;
    --radius: 14px;
    --warn-bg: #fff6e5;
    --warn-border: #f0d38a;
    --warn-text: #7a5a00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header { padding: 36px 20px 20px; text-align: center; }
  header h1 { font-size: 1.4rem; font-weight: 800; }
  header p { font-size: .85rem; color: var(--text-sub); margin-top: 8px; line-height: 1.6; }

  main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 22px;
    margin-bottom: 18px;
  }
  .card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 14px; }
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  .field label.field-label { display: block; font-size: .82rem; font-weight: 700; color: var(--text-sub); margin-bottom: 8px; }

  .seg { display: flex; border: 1.5px solid var(--border); border-radius: 10px; overflow: hidden; }
  .seg button {
    flex: 1; padding: 10px 8px; border: 0; background: var(--surface); color: var(--text);
    font-size: .85rem; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .seg button + button { border-left: 1.5px solid var(--border); }
  .seg button.active { background: var(--primary); color: #fff; }

  input[type=text], input[type=number], input[type=date], select {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1.5px solid var(--border);
    font-size: .95rem; font-family: inherit; background: var(--surface); color: var(--text);
  }
  input:focus, select:focus { outline: 2px solid var(--primary-light); border-color: var(--primary); }

  .subject-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 0; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .subject-row:last-child { border-bottom: 0; }
  .subject-row .name { flex: 0 0 70px; font-size: .88rem; font-weight: 600; }
  .subject-row .seg { flex: 1; }
  .subject-row .seg button { padding: 8px 4px; font-size: .78rem; }
  .row-controls { flex: 1; display: flex; align-items: center; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .include-toggle { display: flex; align-items: center; gap: 5px; font-size: .78rem; color: var(--text-sub); white-space: nowrap; }
  .include-toggle input { width: 16px; height: 16px; }
  .hensachi-input { width: 72px !important; text-align: center; padding: 8px !important; flex: none; }
  .social-type-select { width: auto !important; padding: 8px 10px !important; font-size: .8rem !important; flex: none; }
  .level-seg { flex: 1; min-width: 180px; }
  .level-seg button { padding: 8px 4px; font-size: .78rem; }

  .btn-primary {
    width: 100%; padding: 15px; border-radius: 12px; border: 0; background: var(--primary); color: #fff;
    font-size: 1rem; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 4px;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary {
    width: 100%; padding: 13px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface);
    color: var(--primary-dark); font-size: .9rem; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 10px;
  }

  .hint { font-size: .76rem; color: var(--text-sub); margin-top: 6px; line-height: 1.5; }

  .hidden { display: none !important; }

  .disclaimer {
    background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text);
    border-radius: 10px; padding: 12px 14px; font-size: .8rem; line-height: 1.6; margin-bottom: 18px;
  }

  .result-header { text-align: center; margin-bottom: 20px; }
  .result-header .school { font-size: .85rem; color: var(--text-sub); }
  .result-header .title { font-size: 1.25rem; font-weight: 800; margin-top: 4px; }
  .result-header .meta { font-size: .8rem; color: var(--text-sub); margin-top: 6px; }

  .phase-card { border-left: 5px solid var(--primary); }
  .phase-card .phase-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .phase-card .phase-name { font-size: 1.05rem; font-weight: 800; }
  .phase-card .phase-weeks { font-size: .78rem; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 3px 10px; border-radius: 999px; }
  .phase-card .phase-desc { font-size: .84rem; color: var(--text-sub); line-height: 1.6; margin-bottom: 14px; }

  .subject-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .subject-bar-row:last-child { margin-bottom: 0; }
  .subject-bar-row .sname { flex: 0 0 78px; font-size: .8rem; font-weight: 600; }
  .subject-bar-row .track { flex: 1; height: 10px; background: var(--bg); border-radius: 999px; overflow: hidden; }
  .subject-bar-row .fill { height: 100%; background: var(--primary); border-radius: 999px; }
  .subject-bar-row .pct { flex: 0 0 34px; font-size: .76rem; text-align: right; color: var(--text-sub); }

  .short-warning {
    background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text);
    border-radius: 10px; padding: 14px; font-size: .85rem; line-height: 1.7; margin-bottom: 18px;
  }

  .book-section { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--border); }
  .book-section-title { font-size: .78rem; font-weight: 700; color: var(--text-sub); margin-bottom: 10px; }
  .book-row { margin-bottom: 12px; }
  .book-row:last-child { margin-bottom: 0; }
  .book-subject { font-size: .78rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 4px; }
  .book-title-input { font-size: .84rem !important; padding: 9px 10px !important; margin-bottom: 6px; }
  .book-units-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .book-units-input { width: 64px !important; padding: 7px !important; text-align: center; flex: none; }
  .book-unit-label { font-size: .76rem; color: var(--text-sub); }
  .book-pace { margin-left: auto; font-size: .8rem; font-weight: 700; color: var(--primary); }
  .book-guidance { font-size: .82rem; color: var(--text-sub); line-height: 1.6; }
</style>
</head>
<body>
<header>
  <h1>逆算学習計画メーカー（仮）</h1>
  <p>志望試験・現在の学力・残り期間から、週単位の逆算学習計画を自動生成します</p>
</header>

<main>
  <section id="screen-form">
    <div class="card">
      <h2>1. 志望試験</h2>
      <!-- 医学部編入モードは一旦UIから非表示（一般受験に絞る方針、2026-09-23）。コードは残してあるので復活可能 -->
      <div class="field hidden">
        <label class="field-label">試験タイプ</label>
        <div class="seg" id="exam-type-seg">
          <button type="button" data-val="general" class="active">一般受験</button>
          <button type="button" data-val="henyu">医学部編入</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label">志望校（任意・記録用）</label>
        <input type="text" id="school-input" placeholder="例：〇〇大学医学部" />
      </div>
      <div class="field">
        <label class="field-label">志望校の難易度帯</label>
        <div class="seg" id="school-tier-seg">
          <button type="button" data-val="competitive" class="active">難関〜最難関（旧帝大・上位私立等）</button>
          <button type="button" data-val="standard">標準（地方国公立・中堅私立等）</button>
        </div>
        <div class="hint">参考書ルートをどのレベルまで進めるかに反映されます（標準は早慶レベルの教材までは進めません）。</div>
      </div>
    </div>

    <div class="card">
      <h2>2. 残り期間</h2>
      <div class="field">
        <label class="field-label">入力方法</label>
        <div class="seg" id="period-mode-seg">
          <button type="button" data-val="date" class="active">試験日から計算</button>
          <button type="button" data-val="weeks">週数を直接入力</button>
        </div>
      </div>
      <div class="field" id="period-date-field">
        <label class="field-label">試験日</label>
        <input type="date" id="exam-date-input" />
      </div>
      <div class="field hidden" id="period-weeks-field">
        <label class="field-label">残り週数</label>
        <input type="number" id="weeks-input" min="1" max="104" placeholder="例：24" />
      </div>
      <div class="hint" id="period-hint"></div>
    </div>

    <div class="card">
      <h2>3. 現在の学力レベル</h2>
      <div class="field">
        <label class="field-label">入力方法</label>
        <div class="seg" id="level-mode-seg">
          <button type="button" data-val="hensachi" class="active">模試の偏差値がある</button>
          <button type="button" data-val="category">模試を受けたことがない</button>
        </div>
      </div>
      <div class="field" id="level-hensachi-field">
        <label class="field-label">全体偏差値（直近の模試）</label>
        <input type="number" id="overall-hensachi-input" min="30" max="80" placeholder="例：55" />
      </div>
      <div class="field hidden" id="level-category-field">
        <label class="field-label">今の状態に近いものを選んでください</label>
        <div class="seg" id="level-category-seg" style="flex-direction: column;">
          <button type="button" data-val="blank" class="active">白紙に近い（これから基礎から）</button>
          <button type="button" data-val="shaky">基礎は触ったが抜け漏れが多い</button>
          <button type="button" data-val="ok">基礎はできる（応用に穴がある）</button>
          <button type="button" data-val="applied">応用・過去問演習ができる</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>4. 得意・苦手科目</h2>
      <div class="hint" style="margin-top:0;margin-bottom:14px" id="subject-mode-hint"></div>
      <div id="subject-list"></div>
      <div class="hint">理科・現代文・古文・漢文・社会は「含める」のチェックを外すと計画から外れます。現代文/古文/漢文・社会は国公立の共通テスト対策用（一般受験のみ）。編入の場合は小論文・面接も含みます。</div>
    </div>

    <button class="btn-primary" id="btn-generate">学習計画を作成する</button>
  </section>

  <section id="screen-result" class="hidden">
    <div class="disclaimer">本ツールが出す計画はあくまで目安であり、合格を保証するものではありません。参考情報としてご利用ください。</div>
    <div class="result-header">
      <div class="school" id="result-school"></div>
      <div class="title" id="result-title"></div>
      <div class="meta" id="result-meta"></div>
    </div>
    <div id="result-body"></div>
    <button class="btn-secondary" id="btn-edit">条件を変えてもう一度</button>
  </section>
</main>

<script>
  // ── 状態 ──────────────────────────────────────────
  const state = {
    examType: 'general',   // general | henyu
    school: '',
    schoolTier: 'competitive', // competitive（難関〜最難関）| standard（標準）：参考書ルートの到達目標に反映
    periodMode: 'date',    // date | weeks
    examDate: '',
    weeksDirect: null,
    levelMode: 'hensachi', // hensachi | category
    overallHensachi: null,
    overallCategory: 'blank', // blank | shaky | ok | applied（模試未受験時の全体レベル）
    subjectIncluded: { bio: true, chem: true, phys: false, gendaibun: false, kobun: false, kanbun: false, social: false }, // 任意科目のみ対象トグルが必要
    socialType: 'geography', // geography | japanese_history | world_history | ethics | politics_economy
    subjectHensachi: { english: null, math: null, bio: null, chem: null, phys: null, gendaibun: null, kobun: null, kanbun: null, social: null, essay: null, interview: null },
    subjectCategory: { english: 'normal', math: 'normal', bio: 'normal', chem: 'normal', phys: 'normal', gendaibun: 'normal', kobun: 'normal', kanbun: 'normal', social: 'normal', essay: 'normal', interview: 'normal' },
    bookOverrides: {}, // `${phaseKey}_${subjectKey}` -> { title, units, unitLabel }（教材の手入力・上書き）
  };

  const $ = (id) => document.getElementById(id);

  const SUBJECT_META = {
    english:   { label: '英語',   required: true },
    math:      { label: '数学',   required: true },
    bio:       { label: '生物',   required: false },
    chem:      { label: '化学',   required: false },
    phys:      { label: '物理',   required: false },
    gendaibun: { label: '現代文', required: false, generalOnly: true }, // 国公立医学部の共通テストで必要。編入では基本不要
    kobun:     { label: '古文',   required: false, generalOnly: true },
    kanbun:    { label: '漢文',   required: false, generalOnly: true },
    social:    { label: '社会',   required: false, generalOnly: true }, // 同上。日本史/世界史/地理/倫理から選択
    essay:     { label: '小論文', required: true, henyuOnly: true },
    interview: { label: '面接',   required: true, henyuOnly: true },
  };

  // ── セグメントボタン共通ハンドラ ──────────────────────
  function wireSeg(containerId, onChange) {
    const el = $(containerId);
    el.querySelectorAll('button').forEach((btn) => {
      btn.addEventListener('click', () => {
        el.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        onChange(btn.dataset.val);
      });
    });
  }

  wireSeg('exam-type-seg', (val) => { state.examType = val; renderSubjectList(); });
  wireSeg('school-tier-seg', (val) => { state.schoolTier = val; });
  wireSeg('period-mode-seg', (val) => {
    state.periodMode = val;
    $('period-date-field').classList.toggle('hidden', val !== 'date');
    $('period-weeks-field').classList.toggle('hidden', val !== 'weeks');
  });
  wireSeg('level-mode-seg', (val) => {
    state.levelMode = val;
    $('level-hensachi-field').classList.toggle('hidden', val !== 'hensachi');
    $('level-category-field').classList.toggle('hidden', val !== 'category');
    renderSubjectList();
  });
  wireSeg('level-category-seg', (val) => { state.overallCategory = val; });
  $('overall-hensachi-input').addEventListener('input', (e) => {
    state.overallHensachi = e.target.value === '' ? null : parseFloat(e.target.value);
  });

  $('school-input').addEventListener('input', (e) => { state.school = e.target.value; });
  $('exam-date-input').addEventListener('change', (e) => {
    state.examDate = e.target.value;
    updatePeriodHint();
  });
  $('weeks-input').addEventListener('input', (e) => {
    state.weeksDirect = parseInt(e.target.value, 10) || null;
  });

  function todayStr() {
    const d = new Date();
    return d.toISOString().slice(0, 10);
  }
  $('exam-date-input').min = todayStr();

  function computeWeeksFromDate(dateStr) {
    if (!dateStr) return null;
    const exam = new Date(dateStr + 'T00:00:00');
    const now = new Date();
    now.setHours(0, 0, 0, 0);
    const diffDays = Math.ceil((exam - now) / (1000 * 60 * 60 * 24));
    return Math.max(1, Math.ceil(diffDays / 7));
  }

  function updatePeriodHint() {
    if (state.periodMode === 'date' && state.examDate) {
      const w = computeWeeksFromDate(state.examDate);
      $('period-hint').textContent = `試験日まで約 ${w} 週間`;
    } else {
      $('period-hint').textContent = '';
    }
  }

  function getTotalWeeks() {
    if (state.periodMode === 'date') return computeWeeksFromDate(state.examDate);
    return state.weeksDirect;
  }

  // ── 科目リスト描画 ──────────────────────────────────
  function renderSubjectList() {
    $('subject-mode-hint').textContent = state.levelMode === 'hensachi'
      ? '科目ごとの偏差値を入力してください（空欄は全体偏差値と同じ＝普通として扱います）。'
      : '各科目について、自分の中での得意・苦手を選んでください。';

    const isHenyu = state.examType === 'henyu';
    const keys = Object.keys(SUBJECT_META).filter((k) =>
      (!SUBJECT_META[k].henyuOnly || isHenyu) && (!SUBJECT_META[k].generalOnly || !isHenyu)
    );
    const wrap = $('subject-list');
    wrap.innerHTML = '';
    keys.forEach((key) => {
      const meta = SUBJECT_META[key];
      const included = meta.required || state.subjectIncluded[key];
      const row = document.createElement('div');
      row.className = 'subject-row';
      row.dataset.key = key;

      let controlsHtml = '';
      if (!meta.required) {
        controlsHtml += `<label class="include-toggle"><input type="checkbox" class="include-check" ${included ? 'checked' : ''}/> 含める</label>`;
      }
      if (included && key === 'social') {
        controlsHtml += `<select class="social-type-select">${Object.entries(SOCIAL_TYPE_LABEL).map(([val, label]) => `<option value="${val}" ${state.socialType === val ? 'selected' : ''}>${label}</option>`).join('')}</select>`;
      }
      if (included) {
        if (state.levelMode === 'hensachi') {
          const v = state.subjectHensachi[key];
          controlsHtml += `<input type="number" class="hensachi-input" min="30" max="80" placeholder="例:50" value="${v != null ? v : ''}" />`;
        } else {
          const options = [['weak', '苦手'], ['normal', '普通'], ['strong', '得意']];
          controlsHtml += `<div class="seg level-seg">${options.map(([val, label]) => `<button type="button" data-val="${val}" class="${state.subjectCategory[key] === val ? 'active' : ''}">${label}</button>`).join('')}</div>`;
        }
      }

      row.innerHTML = `<span class="name">${meta.label}</span><div class="row-controls">${controlsHtml}</div>`;
      wrap.appendChild(row);

      const checkEl = row.querySelector('.include-check');
      if (checkEl) {
        checkEl.addEventListener('change', (e) => {
          state.subjectIncluded[key] = e.target.checked;
          renderSubjectList();
        });
      }
      const socialTypeEl = row.querySelector('.social-type-select');
      if (socialTypeEl) {
        socialTypeEl.addEventListener('change', (e) => { state.socialType = e.target.value; });
      }
      const hensachiEl = row.querySelector('.hensachi-input');
      if (hensachiEl) {
        hensachiEl.addEventListener('input', (e) => {
          state.subjectHensachi[key] = e.target.value === '' ? null : parseFloat(e.target.value);
        });
      }
      const levelSeg = row.querySelector('.level-seg');
      if (levelSeg) {
        levelSeg.querySelectorAll('button').forEach((btn) => {
          btn.addEventListener('click', () => {
            levelSeg.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            state.subjectCategory[key] = btn.dataset.val;
          });
        });
      }
    });
  }
  renderSubjectList();

  // ── 逆算ロジック ──────────────────────────────────
  // 模試未受験者向けの全体レベル選択肢 → 偏差値相当スコアへのマッピング
  const CATEGORY_SCORE = { blank: 35, shaky: 45, ok: 55, applied: 65 };
  const CATEGORY_LABEL = {
    blank: '白紙に近い（これから基礎から）',
    shaky: '基礎は触ったが抜け漏れが多い',
    ok: '基礎はできる（応用に穴がある）',
    applied: '応用・過去問演習ができる',
  };

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function getOverallScore() {
    if (state.levelMode === 'hensachi') {
      return state.overallHensachi != null ? state.overallHensachi : 50;
    }
    return CATEGORY_SCORE[state.overallCategory];
  }

  // 科目の相対的な強さ（delta）：偏差値モードは「科目偏差値−全体偏差値」、未受験モードは苦手/普通/得意を±10相当に変換
  function getSubjectDelta(key, overallScore) {
    if (state.levelMode === 'hensachi') {
      const v = state.subjectHensachi[key];
      if (v == null) return 0;
      return v - overallScore;
    }
    return { weak: -10, normal: 0, strong: 10 }[state.subjectCategory[key]];
  }

  // 偏差値35/50/65をそれぞれ「基礎からやり直し／ある程度できるが穴がある／仕上げ段階」相当のフェーズ配分とみなし、
  // 実際のスコアはその間（外側はクランプ）を線形補間する。3段階の離散選択だった頃の比率をそのままアンカーとして流用。
  const RATIO_ANCHORS = [
    { s: 35, r: { found: 0.40, drill: 0.30, polish: 0.20, final: 0.10 } },
    { s: 50, r: { found: 0.25, drill: 0.35, polish: 0.25, final: 0.15 } },
    { s: 65, r: { found: 0.10, drill: 0.30, polish: 0.35, final: 0.25 } },
  ];
  function ratioFromScore(score) {
    const [a, b, c] = RATIO_ANCHORS;
    if (score <= a.s) return a.r;
    if (score >= c.s) return c.r;
    const [lo, hi] = score < b.s ? [a, b] : [b, c];
    const t = (score - lo.s) / (hi.s - lo.s);
    const lerp = (k) => lo.r[k] + (hi.r[k] - lo.r[k]) * t;
    return { found: lerp('found'), drill: lerp('drill'), polish: lerp('polish'), final: lerp('final') };
  }

  // 参考書ルート：科目ごとに基礎固め期→演習期→総仕上げ期→直前期の4段階（PHASE_ORDERの並びに対応）

  // 社会は選択科目により参考書ルートが大きく異なるため、科目タイプ別に用意する

  // （旧課程の統合科目「倫理，政治・経済」はもう存在しない）
  const SOCIAL_TYPE_LABEL = {

  };
  const SOCIAL_BOOK_DB = {

    ],

    ],
    politics_economy: [
      { title: '蔭山の共通テスト公共 → 蔭山の共通テスト政治・経済', units: 50, unitLabel: '単元' },
      { title: '共通テスト 政治・経済 集中講義', units: 50, unitLabel: '単元' },

  // 小論文・面接は「教材を1冊仕上げる」型のペース配分にそぐわないため、固定の練習ガイダンスを表示する
  const SUBJECT_GUIDANCE = {
    essay: '週1本、志望校の過去問テーマで答案を書き、添削を受ける。',
    interview: '月1回、想定質問（志望動機・医療系時事等）で模擬面接を行う。',
  };

  // 参考書は「今何フェーズ目か」だけでなく「その科目の絶対偏差値」からスタート地点を決める。
  // 既に得意な科目は基礎の本を素通りし、苦手な科目は基礎からしっかり積む。
  // 志望校の難易度帯は「どこまでのレベルの教材まで進める必要があるか（到達上限）」に反映する
  function startBandFromAbsScore(abs) {
    if (abs < 45) return 0;
    if (abs < 55) return 1;
    if (abs < 65) return 2;
    return 3;
  }
  const SCHOOL_TIER_TARGET_BAND = { competitive: 3, standard: 2 };
  function bookBandForPhase(abs, phaseIdx, db) {
    const maxIdx = db.length - 1;
    if (phaseIdx === maxIdx) return maxIdx; // 直前期は常に志望校過去問演習
    const startBand = Math.min(startBandFromAbsScore(abs), maxIdx);
    const targetBand = Math.min(SCHOOL_TIER_TARGET_BAND[state.schoolTier] ?? maxIdx, maxIdx);
    return Math.min(startBand + phaseIdx, targetBand);
  }

  function escapeAttr(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const PHASE_META = {
    found:  { name: '基礎固め期',   desc: '教科書レベルの抜け・漏れを潰す期間。苦手科目を中心に、土台を作り直すことに時間を使う。' },
    drill:  { name: '演習期',       desc: '基礎を土台に、問題演習量を増やして得点力をつける期間。苦手科目の比重は残しつつ、実戦形式の演習を増やす。' },
    polish: { name: '総仕上げ期',   desc: '全科目のバランスを整え、過去問演習を本格化する期間。苦手・得意にかかわらず穴を残さない。' },
    final:  { name: '直前期',       desc: '得意科目で確実に得点しつつ、苦手科目は最低限のコンディションを維持する期間。新しいことには手を広げない。' },
};

  // レベル×残り期間の長さで、基礎固め期の比率を圧縮し、演習・総仕上げ・直前に再配分する
  function adjustRatioForWeeks(baseRatio, weeks) {
    const r = { ...baseRatio };
    if (weeks < 20) { r.found -= 0.05; r.drill += 0.05; }
    if (weeks < 12) { r.found -= 0.05; r.polish += 0.05; }
    if (weeks < 6)  { r.found -= 0.05; r.final += 0.05; }
    const floor = weeks < 6 ? 0 : 0.05;
    if (r.found < floor) {
      const deficit = floor - r.found;
      r.found = floor;
      r.drill -= deficit; // 演習期から不足分を吸収
    }
    const sum = r.found + r.drill + r.polish + r.final;
    return { found: r.found / sum, drill: r.drill / sum, polish: r.polish / sum, final: r.final / sum };
  }

  function weeksToPhases(ratio, totalWeeks) {
    const raw = {
      found: ratio.found * totalWeeks,
      drill: ratio.drill * totalWeeks,
      polish: ratio.polish * totalWeeks,
      final: ratio.final * totalWeeks,
    };
    const floored = {};
    let used = 0;
    for (const k of ['found', 'drill', 'polish', 'final']) {
      floored[k] = Math.max(k === 'final' ? 1 : 0, Math.floor(raw[k]));
      used += floored[k];
    }
    // 端数を、最も比率が大きい演習期に寄せて帳尻を合わせる
    let remainder = totalWeeks - used;
    const order = ['drill', 'polish', 'found', 'final'];
    let i = 0;
    while (remainder > 0) {
      floored[order[i % order.length]] += 1;
      remainder -= 1;
      i += 1;
    }
    while (remainder < 0) {
      const k = order[i % order.length];
      if (floored[k] > (k === 'final' ? 1 : 0)) { floored[k] -= 1; remainder += 1; }
      i += 1;
      if (i > 40) break; // 安全弁
    }
    return floored;
  }

  // 科目ごとの相対的な強さ（delta、正=得意寄り／負=苦手寄り）とフェーズごとの重み付けで、時間配分（%）を出す
  // delta=0（普通）を基準に、苦手なほど重みを増やす。基礎固め期は苦手科目をさらに強調し、直前期は得意科目の得点源固めを優先する
  function subjectBaseWeight(delta) {
    return clamp(1 - delta * 0.08, 0.5, 2.2);
  }
  const PHASE_SKEW = { found: 0.35, drill: 0.15, polish: 0, final: -0.15 };
  function subjectPhaseWeight(delta, phaseKey) {
    const base = subjectBaseWeight(delta);
    const skew = clamp(1 + (PHASE_SKEW[phaseKey] * -delta) / 10, 0.5, 1.8);
    return base * skew;
  }

  function activeSubjects() {
    const isHenyu = state.examType === 'henyu';
    const overallScore = getOverallScore();
    return Object.keys(SUBJECT_META)
      .filter((k) => (!SUBJECT_META[k].henyuOnly || isHenyu) && (!SUBJECT_META[k].generalOnly || !isHenyu))
      .filter((k) => SUBJECT_META[k].required || state.subjectIncluded[k])
      .map((k) => {
        const delta = getSubjectDelta(k, overallScore);
        return {
          key: k,
          label: k === 'social' ? `社会（${SOCIAL_TYPE_LABEL[state.socialType]}）` : SUBJECT_META[k].label,
          delta,
          abs: overallScore + delta, // 科目の絶対偏差値相当（参考書の開始レベル判定に使う）
        };
      });
  }

  function subjectAllocationForPhase(phaseKey, subjects) {
    const weights = subjects.map((s) => subjectPhaseWeight(s.delta, phaseKey));
    const total = weights.reduce((a, b) => a + b, 0);
    return subjects.map((s, i) => ({ ...s, pct: Math.round((weights[i] / total) * 1000) / 10 }));
  }

  // ── 結果描画 ──────────────────────────────────────
  function generate() {
    const totalWeeks = getTotalWeeks();
    if (!totalWeeks || totalWeeks < 1) {
      alert('残り期間を正しく入力してください。');
      return;
    }
    if (state.levelMode === 'hensachi' && state.overallHensachi == null) {
      alert('全体偏差値を入力してください。');
      return;
    }
    const subjects = activeSubjects();
    if (subjects.length === 0) {
      alert('対象科目を1つ以上選んでください。');
      return;
    }

    const overallScore = getOverallScore();
    const levelLabelText = state.levelMode === 'hensachi' ? `偏差値${overallScore}` : CATEGORY_LABEL[state.overallCategory];

    $('result-school').textContent = state.school ? state.school : '志望校未入力';
    $('result-title').textContent = `合格までの逆算学習計画`;
    $('result-meta').textContent = `${state.examType === 'henyu' ? '医学部編入' : '一般受験'}・${levelLabelText}・残り${totalWeeks}週間`;

    const body = $('result-body');
    body.innerHTML = '';

    if (totalWeeks < 4) {
      const warn = document.createElement('div');
      warn.className = 'short-warning';
      warn.textContent = `残り期間が${totalWeeks}週間と短いため、通常のフェーズ分けではなく直前対策に全振りした計画にしています。苦手科目を優先しつつ、得意科目の確認も欠かさないようにしてください。`;
      body.appendChild(warn);

      const card = buildPhaseCard('final', 1, totalWeeks, subjectAllocationForPhase('final', subjects));
      body.appendChild(card);
    } else {
      const ratio = adjustRatioForWeeks(ratioFromScore(overallScore), totalWeeks);
      const phaseWeeks = weeksToPhases(ratio, totalWeeks);
      let cursor = 1;
      for (const key of ['found', 'drill', 'polish', 'final']) {
        const w = phaseWeeks[key];
        if (w <= 0) continue;
        const card = buildPhaseCard(key, cursor, w, subjectAllocationForPhase(key, subjects));
        body.appendChild(card);
        cursor += w;
      }
    }

    $('screen-form').classList.add('hidden');
    $('screen-result').classList.remove('hidden');
    window.scrollTo(0, 0);
  }

  function buildPhaseCard(phaseKey, startWeek, weekCount, allocations) {
    const meta = PHASE_META[phaseKey];
    const card = document.createElement('div');
    card.className = 'card phase-card';
    const endWeek = startWeek + weekCount - 1;
    const weekLabel = weekCount === 1 ? `第${startWeek}週` : `第${startWeek}〜${endWeek}週`;
    card.innerHTML = `
      <div class="phase-head">
        <span class="phase-name">${meta.name}</span>
        <span class="phase-weeks">${weekLabel}（${weekCount}週間）</span>
      </div>
      <div class="phase-desc">${meta.desc}</div>
      <div class="subject-bars"></div>`;
    const barsWrap = card.querySelector('.subject-bars');
    allocations
      .sort((a, b) => b.pct - a.pct)
      .forEach((s) => {
        const row = document.createElement('div');
        row.className = 'subject-bar-row';
        row.innerHTML = `
          <span class="sname">${s.label}</span>
          <div class="track"><div class="fill" style="width:${s.pct}%"></div></div>
          <span class="pct">${s.pct}%</span>`;
        barsWrap.appendChild(row);
      });

    const booksWrap = document.createElement('div');
    booksWrap.className = 'book-section';
    booksWrap.innerHTML = '<div class="book-section-title">このフェーズで使う教材・1日の目安ペース</div>';
    const phaseIdx = PHASE_ORDER.indexOf(phaseKey);
    allocations.forEach((s) => {
      const row = document.createElement('div');
      row.className = 'book-row';

      if (SUBJECT_GUIDANCE[s.key]) {
        row.innerHTML = `<div class="book-subject">${s.label}</div><div class="book-guidance">${SUBJECT_GUIDANCE[s.key]}</div>`;
        booksWrap.appendChild(row);
        return;
      }

      const db = s.key === 'social' ? SOCIAL_BOOK_DB[state.socialType] : BOOK_DB[s.key];
      if (!db) return;
      const bandIdx = bookBandForPhase(s.abs, phaseIdx, db);
      const rec = db[bandIdx];
      const overrideKey = s.key === 'social' ? `${phaseKey}_social_${state.socialType}_${bandIdx}` : `${phaseKey}_${s.key}_${bandIdx}`;
      if (!state.bookOverrides[overrideKey]) {
        state.bookOverrides[overrideKey] = { title: rec.title, units: rec.units, unitLabel: rec.unitLabel };
      }
      const cur = state.bookOverrides[overrideKey];

      row.innerHTML = `
        <div class="book-subject">${s.label}</div>
        <input type="text" class="book-title-input" value="${escapeAttr(cur.title)}" />
        <div class="book-units-row">
          <input type="number" class="book-units-input" min="1" value="${cur.units}" />
          <span class="book-unit-label">${cur.unitLabel}（目安・調整可）</span>
          <span class="book-pace"></span>
        </div>`;
      booksWrap.appendChild(row);

      const titleInput = row.querySelector('.book-title-input');
      const unitsInput = row.querySelector('.book-units-input');
      const paceEl = row.querySelector('.book-pace');
      function updatePace() {
        const totalDays = weekCount * 7;
        const units = parseFloat(unitsInput.value) || 0;
        const pace = totalDays > 0 ? units / totalDays : 0;
        paceEl.textContent = `1日 ${pace.toFixed(pace < 1 ? 2 : 1)} ${cur.unitLabel}`;
      }
      titleInput.addEventListener('input', (e) => { state.bookOverrides[overrideKey].title = e.target.value; });
      unitsInput.addEventListener('input', (e) => {
        state.bookOverrides[overrideKey].units = parseFloat(e.target.value) || 0;
        updatePace();
      });
      updatePace();
    });
    card.appendChild(booksWrap);

    return card;
  }

  $('btn-generate').addEventListener('click', generate);
  $('btn-edit').addEventListener('click', () => {
    $('screen-result').classList.add('hidden');
    $('screen-form').classList.remove('hidden');
    window.scrollTo(0, 0);
